<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        {% if user.is_authenticated %}
        <a class="navbar-brand brand-mark" href="{% url 'dashboard' %}">Analizator Wydatków</a>
        {% else %}
        <a class="navbar-brand brand-mark" href="{% url 'login' %}">Analizator Wydatków</a>
        {% endif %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'transactions:list' %}">Transactions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'categories:list' %}">Categories</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <span class="text-light small">Signed in as {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                </form>
            </div>
            {% else %}
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
                <a class="btn btn-light btn-sm" href="{% url 'register' %}">Register</a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
