repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: ["--fix"]

      - id: ruff-format

  - repo: local
    hooks:
      - id: typecheck
        name: basedpyright
        entry: pdm run basedpyright
        language: system
        types: [python]